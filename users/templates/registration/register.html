{% extends 'store/base.html' %}

{% block title %}Регистрация — Buava Store{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Регистрация аккаунта</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
    </form>
    <p class="auth-footer">
        Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </p>
</div>
{% endblock %}
