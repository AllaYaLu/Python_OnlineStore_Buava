services:
  # 1. Сервис базы данных PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: online_store_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Сервис веб-приложения Django
  web:
    build: .
    container_name: online_store_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Переопределяем адрес БД, чтобы Django стучался в контейнер 'db', а не в localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: >
        sh -c "python manage.py migrate &&
               python manage.py collectstatic --no-input &&
               gunicorn online_store.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

# Постоянные тома для хранения данных на хосте
volumes:
  postgres_data:
  media_volume:
